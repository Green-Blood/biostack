# BioStack on a home server: API + web (+ Telegram bot). State lives in ./state; nothing is published except the web
# port on 127.0.0.1, which `tailscale serve` exposes to your own devices only.
name: biostack

x-api: &api
  build: ./apps/api
  image: biostack-api
  restart: unless-stopped
  user: "${BIOSTACK_UID:-1000}:${BIOSTACK_GID:-1000}"
  env_file: .env
  environment:
    API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY in .env}
    DATABASE_URL: sqlite:////state/biostack.db
    DATA_DIR: /state/data
    BIOSTACK_API_URL: http://api:8000
  volumes:
    - ./state:/state

services:
  api:
    <<: *api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      BIOSTACK_ACCESS_PASSWORD: ${BIOSTACK_ACCESS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    ports:
      - "127.0.0.1:${WEB_PORT:-3410}:3000"

  bot:
    <<: *api
    command: ["python", "-m", "telegram_bot"]
    restart: on-failure  # it exits cleanly (and stays off) while TELEGRAM_BOT_TOKEN is empty
    depends_on:
      api:
        condition: service_healthy
